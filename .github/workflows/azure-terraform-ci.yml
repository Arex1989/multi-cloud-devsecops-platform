name: Azure Terraform CI

on:
  push:
    branches:
      - main
    paths:
      - "terraform/azure/**"
      - ".github/workflows/azure-terraform-ci.yml"
  pull_request:
    paths:
      - "terraform/azure/**"
      - ".github/workflows/azure-terraform-ci.yml"

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Azure Terraform Validation
    runs-on: ubuntu-latest

    env:
      TF_VAR_admin_ssh_public_key: ${{ vars.AZURE_SSH_PUBLIC_KEY }}

    defaults:
      run:
        working-directory: terraform/azure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color

      - name: Azure CLI Verification
        run: |
          az account show --output table
          az group show \
            --name rg-azure-enterprise-dev \
            --query "{Name:name,Location:location,ProvisioningState:properties.provisioningState}" \
            --output table